[package]
name = "gosh-lan-transfer"
version = "0.5.0"
description = "Core file transfer engine for LAN-based peer-to-peer file sharing"
authors = ["Goshitsarch"]
license = "MIT"
repository = "https://github.com/goshitsarch-eng/gosh-lan-transfer"
edition = "2021"
keywords = ["file-transfer", "lan", "peer-to-peer", "networking"]
categories = ["network-programming", "filesystem"]

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP server
axum = { version = "0.8", features = ["ws"] }
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs"] }

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["stream", "json", "rustls-tls"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Network utilities
local-ip-address = "0.6"
socket2 = { version = "0.5", features = ["all"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
tokio-stream = { version = "0.1", features = ["sync"] }
hostname = "0.4"

# File handling
futures = "0.3"
futures-util = "0.3"
bytes = "1"
mime_guess = "2"

# Secure transport and durable transfers
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
sha2 = "0.10"
subtle = "2"
tempfile = "3"

# Utilities
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tracing = "0.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Networking_WinSock"] }

[dev-dependencies]
rcgen = "0.13"
tokio-test = "0.4"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[features]
default = []
